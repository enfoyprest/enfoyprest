<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>En Foy Prest</title>
  <meta name="description" content="En Foy Prest is a design and lifestyle company by Hunter Masfen.">

  <style>
    :root {
      --background: #7D050D;
      --text: #FFFADE;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: Futura, "Trebuchet MS", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 900px;
      padding: 56px 28px;
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 34px;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 300;
    }

    .logo {
      display: block;
      width: min(78vw, 620px);
      height: auto;
      margin: 0 auto;
    }

    .rule {
      width: 72px;
      height: 1px;
      background: currentColor;
      margin: 38px auto 34px;
      opacity: 0.65;
    }

    p {
      margin: 0 auto;
      max-width: 560px;
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.6;
      font-weight: 300;
    }

    .status {
      margin-top: 18px;
      font-style: italic;
    }

    .contact {
      margin-top: 46px;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 300;
    }

    a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 3px;
    }

    a:hover {
      opacity: 0.75;
    }

    footer {
      margin-top: 72px;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0.8;
      font-weight: 300;
    }

    @media (max-width: 600px) {
      main {
        padding: 44px 22px;
      }

      .eyebrow {
        font-size: 11px;
        margin-bottom: 28px;
      }

      .logo {
        width: min(86vw, 520px);
      }

      p {
        font-size: 16px;
      }

      footer {
        margin-top: 58px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="eyebrow">Ready in Faith</div>

    <img class="logo" src="logo.png" alt="En Foy Prest">

    <div class="rule"></div>

    <p>
      A design and lifestyle company by Hunter H Masfen.
    </p>

    <p class="status">
      Currently in development.
    </p>

    <div class="contact">
      <a href="mailto:info@enfoyprest.com">info@enfoyprest.com</a>
    </div>

    <footer>
      Est. 2026
    </footer>
  </main>
</body>
</html>
