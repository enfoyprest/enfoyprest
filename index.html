<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>En Foy Prest</title>
  <meta name="description" content="En Foy Prest is a design and lifestyle company by Hunter Masfen.">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fffade;
      color: #2b2118;
      font-family: Georgia, 'Times New Roman', serif;
    }

    main {
      max-width: 720px;
      padding: 48px 28px;
      text-align: center;
    }

    h1 {
      font-size: clamp(42px, 8vw, 86px);
      font-weight: 400;
      letter-spacing: 0.02em;
      margin: 0 0 28px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      margin: 0 0 18px;
    }

    .small {
      margin-top: 42px;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
    }
  </style>
</head>
<body>
  <main>
    <h1>En Foy Prest</h1>
    <p>A design and lifestyle company by Hunter Masfen.</p>
    <p>Currently in development.</p>
    <p class="small">
      <a href="mailto:info@enfoyprest.com">info@enfoyprest.com</a>
    </p>

</html>
